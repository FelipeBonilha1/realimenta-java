spring.application.name=realimenta-sp

# O Render injeta PORT. Fora dele, a API sobe em 8080.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Nunca devolver stack trace, mensagem interna ou erros de binding no formato padrao do container.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Conexao somente por variavel de ambiente. Nao ha banco em memoria de substituicao.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.pool-name=RealimentaOracle
spring.datasource.hikari.maximum-pool-size=5
# Sobe somente se o Oracle aceitar a conexao. Sem isso, /api/saude ficaria no ar mesmo com o banco inacessivel.
spring.datasource.hikari.initialization-fail-timeout=15000

# Os scripts em src/main/resources/db sao manuais. A aplicacao nao os executa.
spring.sql.init.mode=never

# Jackson 3 (Spring Boot 4) ja serializa data como texto. A propriedade fixa o contrato da API.
spring.jackson.datatype.datetime.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=true
